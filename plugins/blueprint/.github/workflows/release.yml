name: Release plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (0.1.N); reuse it to resume a failed publication'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blueprint-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Resolve new release or resume existing tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/run.ts inspect
      - name: Validate source before changing version
        if: steps.release.outputs.done != 'true'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          bun install --frozen-lockfile
          bun scripts/build.ts --web-only
          bun run typecheck
          bun test tests
          bunx --no-install playwright install chromium
          bun run check:browser
          bun run check:stability
          bun run check:layout
      - name: Prepare local release commit
        if: steps.release.outputs.done != 'true'
        env:
          RELEASE_BASE: ${{ steps.release.outputs.base }}
          RELEASE_RESUME: ${{ steps.release.outputs.resume }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bun scripts/release/run.ts prepare
      - name: Build and verify release commit
        if: steps.release.outputs.done != 'true'
        run: |
          set -euo pipefail
          bun run build
          bun run typecheck
          bun run package
          test "$(dist/blueprint-plugin/bin/blueprint --version)" = "blueprint-plugin $RELEASE_VERSION"
      - name: Publish commit, tag and verified assets
        if: steps.release.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE: ${{ steps.release.outputs.base }}
          RELEASE_RESUME: ${{ steps.release.outputs.resume }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          bun scripts/release/run.ts publish
